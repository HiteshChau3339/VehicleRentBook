<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customers - Rent Book Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mobile Drawer Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="d-flex align-items-center gap-2">
            <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle Menu">
                <i class="bi bi-list"></i>
            </button>
            <span class="fw-bold fs-5 text-white">Rent Book</span>
        </div>
        <span class="badge bg-primary-soft rounded-pill">Pro</span>
    </header>

    <div class="wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <h3 class="logo mb-0"><i class="bi bi-truck-front-fill"></i><span>Rent Book</span></h3>
                <button class="mobile-menu-btn d-md-none" onclick="toggleSidebar()"><i class="bi bi-x-lg"></i></button>
            </div>
            
            <ul class="menu mt-3">
                <li><a href="index.html"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a></li>
                <li><a href="vehicles.html"><i class="bi bi-car-front-fill"></i><span>Vehicles</span></a></li>
                <li class="active"><a href="customers.html"><i class="bi bi-people-fill"></i><span>Customers</span></a></li>
                <li><a href="rent.html"><i class="bi bi-cash-stack"></i><span>Monthly Rent</span></a></li>
                <li><a href="expenses.html"><i class="bi bi-wallet2"></i><span>Expenses</span></a></li>
                <li><a href="reports.html"><i class="bi bi-bar-chart-line-fill"></i><span>Reports</span></a></li>
                <li><a href="ledger.html"><i class="bi bi-journal-bookmark-fill"></i><span>Vehicle Ledger</span></a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="content">
            <div class="topbar">
                <div>
                    <h2 class="page-title">Customer Directory</h2>
                    <p class="text-muted small mb-0">Manage customer records, contact info, and status.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Customer Form (Add/Edit) -->
                <div class="col-xl-4 col-lg-5">
                    <div class="panel-card p-3 p-md-4">
                        <h5 class="fw-bold mb-3 fs-6" id="formTitle"><i class="bi bi-person-plus-fill text-primary me-2"></i>Add New Customer</h5>
                        <form id="customerForm">
                            <input type="hidden" id="editCustomerIndex" value="-1">

                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="cName" class="form-control" placeholder="e.g. Rahul Sharma" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="cPhone" class="form-control" placeholder="e.g. +91 98765 43210" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="cEmail" class="form-control" placeholder="e.g. rahul@example.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea id="cAddress" class="form-control" rows="2" placeholder="City, State"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select id="cStatus" class="form-select">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                                    <i class="bi bi-check-circle me-1"></i> Save Customer
                                </button>
                                <button type="button" id="cancelBtn" class="btn btn-outline-secondary d-none" onclick="cancelCustomerEdit()">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Customer Directory Table -->
                <div class="col-xl-8 col-lg-7">
                    <div class="panel-card p-3 p-md-4">
                        <h5 class="fw-bold mb-3 fs-6">Registered Customers</h5>
                        <div class="table-responsive">
                            <table class="table custom-table align-middle">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Phone</th>
                                        <th>Email</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="customerList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("show");
            document.getElementById("sidebarOverlay").classList.toggle("active");
        }

        function loadCustomers() {
            let customers = JSON.parse(localStorage.getItem("customers")) || [];
            let tbody = document.getElementById("customerList");

            if (customers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No customers added yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = customers.map((c, i) => `
                <tr>
                    <td>
                        <div class="fw-bold text-dark">${c.name}</div>
                        <small class="text-muted">${c.address || ''}</small>
                    </td>
                    <td><span class="fw-medium">${c.phone}</span></td>
                    <td><small class="text-muted">${c.email || '-'}</small></td>
                    <td>
                        <span class="badge ${c.status === 'Active' ? 'bg-success-soft' : 'bg-danger-soft'}">
                            ${c.status || 'Active'}
                        </span>
                    </td>
                    <td class="text-end">
                        <div class="btn-group btn-group-sm">
                            <button onclick="editCustomer(${i})" class="btn btn-outline-primary" title="Edit Customer"><i class="bi bi-pencil-square"></i></button>
                            <button onclick="deleteCustomer(${i})" class="btn btn-outline-danger" title="Delete Customer"><i class="bi bi-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById("customerForm").addEventListener("submit", (e) => {
            e.preventDefault();
            let customers = JSON.parse(localStorage.getItem("customers")) || [];
            let index = parseInt(document.getElementById("editCustomerIndex").value);

            let data = {
                name: document.getElementById("cName").value.trim(),
                phone: document.getElementById("cPhone").value.trim(),
                email: document.getElementById("cEmail").value.trim(),
                address: document.getElementById("cAddress").value.trim(),
                status: document.getElementById("cStatus").value
            };

            if (index >= 0) {
                customers[index] = data;
            } else {
                customers.push(data);
            }

            localStorage.setItem("customers", JSON.stringify(customers));
            cancelCustomerEdit();
            loadCustomers();
        });

        function editCustomer(i) {
            let customers = JSON.parse(localStorage.getItem("customers")) || [];
            let c = customers[i];
            if (!c) return;

            document.getElementById("editCustomerIndex").value = i;
            document.getElementById("cName").value = c.name || '';
            document.getElementById("cPhone").value = c.phone || '';
            document.getElementById("cEmail").value = c.email || '';
            document.getElementById("cAddress").value = c.address || '';
            document.getElementById("cStatus").value = c.status || 'Active';

            document.getElementById("formTitle").innerHTML = `<i class="bi bi-pencil-square text-primary me-2"></i>Edit Customer`;
            document.getElementById("submitBtn").innerHTML = `<i class="bi bi-check-circle me-1"></i> Update Customer`;
            document.getElementById("cancelBtn").classList.remove("d-none");
        }

        function cancelCustomerEdit() {
            document.getElementById("customerForm").reset();
            document.getElementById("editCustomerIndex").value = "-1";
            document.getElementById("formTitle").innerHTML = `<i class="bi bi-person-plus-fill text-primary me-2"></i>Add New Customer`;
            document.getElementById("submitBtn").innerHTML = `<i class="bi bi-check-circle me-1"></i> Save Customer`;
            document.getElementById("cancelBtn").classList.add("d-none");
        }

        function deleteCustomer(i) {
            if (confirm("Are you sure you want to delete this customer?")) {
                let customers = JSON.parse(localStorage.getItem("customers")) || [];
                customers.splice(i, 1);
                localStorage.setItem("customers", JSON.stringify(customers));
                cancelCustomerEdit();
                loadCustomers();
            }
        }

        document.addEventListener("DOMContentLoaded", loadCustomers);
    </script>
</body>
</html>
