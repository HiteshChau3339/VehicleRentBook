<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Rent Book Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <!-- Mobile Drawer Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="d-flex align-items-center gap-2">
            <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle Menu">
                <i class="bi bi-list"></i>
            </button>
            <span class="fw-bold fs-5 text-white">Rent Book</span>
        </div>
        <span class="badge bg-primary-soft rounded-pill">Pro</span>
    </header>
    <div class="wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <h3 class="logo mb-0"><i class="bi bi-truck-front-fill"></i><span>Rent Book</span></h3>
                <button class="mobile-menu-btn d-md-none" onclick="toggleSidebar()"><i class="bi bi-x-lg"></i></button>
            </div>
            
            <ul class="menu mt-3">
                <li><a href="index.html"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a></li>
                <li><a href="vehicles.html"><i class="bi bi-car-front-fill"></i><span>Vehicles</span></a></li>
                <li><a href="customers.html"><i class="bi bi-people-fill"></i><span>Customers</span></a></li>
                <li><a href="rent.html"><i class="bi bi-cash-stack"></i><span>Monthly Rent</span></a></li>
                <li class="active"><a href="expenses.html"><i class="bi bi-wallet2"></i><span>Expenses</span></a></li>
                <li><a href="reports.html"><i class="bi bi-bar-chart-line-fill"></i><span>Reports</span></a></li>
                <li><a href="ledger.html"><i class="bi bi-journal-bookmark-fill"></i><span>Vehicle Ledger</span></a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="content">
            <div class="topbar">
                <div>
                    <h2 class="page-title">Operational Expenses Log</h2>
                    <p class="text-muted small mb-0">Record, edit, and manage vehicle expense entries.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Left Column: Inline Form (Add / Edit) -->
                <div class="col-lg-4">
                    <div class="panel-card p-4">
                        <h5 class="fw-bold mb-3" id="formHeader">
                            <i class="bi bi-wallet text-danger me-2"></i>Log Expense
                        </h5>
                        <form id="expForm" onsubmit="event.preventDefault(); saveExpense();">
                            <input type="hidden" id="expEditIndex" value="">

                            <div class="mb-3">
                                <label class="form-label">Vehicle <span class="text-danger">*</span></label>
                                <select id="eVehicle" class="form-select" required></select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Date <span class="text-danger">*</span></label>
                                <input type="date" id="eDate" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Category <span class="text-danger">*</span></label>
                                <select id="eCategory" class="form-select" required>
                                    <option value="">Select Category</option>
                                    <option value="EMI">EMI</option>
                                    <option value="Driver Salary">Driver Salary</option>
                                    <option value="Insurance">Insurance</option>
                                    <option value="RTO">RTO</option>
                                    <option value="Fuel">Fuel</option>
                                    <option value="Maintenance">Maintenance</option>
                                    <option value="Toll/Tax">Toll/Tax</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Amount (₹) <span class="text-danger">*</span></label>
                                <input type="number" id="eAmount" class="form-control" placeholder="0" min="0" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <input type="text" id="eDesc" class="form-control" placeholder="Optional notes...">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-grow-1" id="submitBtn">
                                    <i class="bi bi-check-lg me-1"></i> Save Expense
                                </button>
                                <button type="button" class="btn btn-light d-none" id="cancelBtn" onclick="resetForm()">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Right Column: Expense Table -->
                <div class="col-lg-8">
                    <div class="panel-card p-4">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h5 class="fw-bold mb-0">Expense Records</h5>
                            <span class="badge bg-danger-soft" id="totalCount">0 Expenses</span>
                        </div>
                        <div class="table-responsive">
                            <table class="table custom-table align-middle">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Vehicle</th>
                                        <th>Category</th>
                                        <th>Description</th>
                                        <th>Amount</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="expList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
         function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("show");
            document.getElementById("sidebarOverlay").classList.toggle("active");
        }

        function populateVehicles() {
            let vehicles = [];
            try {
                vehicles = JSON.parse(localStorage.getItem("vehicles")) || [];
            } catch (e) {
                vehicles = [];
            }
            let select = document.getElementById("eVehicle");
            select.innerHTML = `<option value="">Select Vehicle</option>` + 
                vehicles.map(v => `<option value="${v.registration}">${v.registration} - ${v.vehicleName || v.name || ''}</option>`).join('');
        }

        function loadExpenseTable() {
            let expenses = [];
            try {
                expenses = JSON.parse(localStorage.getItem("expenses")) || [];
            } catch (e) {
                expenses = [];
            }

            let tbody = document.getElementById("expList");
            document.getElementById("totalCount").innerText = `${expenses.length} Expenses`;

            if (expenses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No expense records found.</td></tr>`;
                return;
            }

            let html = '';
            for (let i = expenses.length - 1; i >= 0; i--) {
                let e = expenses[i];
                html += `
                    <tr>
                        <td><small class="fw-medium">${e.date || '-'}</small></td>
                        <td class="fw-bold text-dark">${e.vehicle || '-'}</td>
                        <td><span class="badge bg-danger-soft">${e.category || 'Other'}</span></td>
                        <td><span class="text-muted small">${e.description || '-'}</span></td>
                        <td class="text-danger fw-bold">₹ ${Number(e.amount || 0).toLocaleString('en-IN')}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editExpense(${i})" title="Edit">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteExpense(${i})" title="Delete">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        function editExpense(index) {
            let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
            let item = expenses[index];

            if (!item) return;

            document.getElementById("expEditIndex").value = index;
            document.getElementById("eVehicle").value = item.vehicle || "";
            document.getElementById("eDate").value = item.date || "";
            document.getElementById("eCategory").value = item.category || "";
            document.getElementById("eAmount").value = item.amount || "";
            document.getElementById("eDesc").value = item.description || "";

            document.getElementById("formHeader").innerHTML = `<i class="bi bi-pencil-square text-primary me-2"></i>Edit Expense`;
            document.getElementById("submitBtn").innerHTML = `<i class="bi bi-check-lg me-1"></i> Update Expense`;
            document.getElementById("cancelBtn").classList.remove("d-none");
        }

        function resetForm() {
            document.getElementById("expForm").reset();
            document.getElementById("expEditIndex").value = "";
            document.getElementById("eDate").value = new Date().toISOString().split('T')[0];

            document.getElementById("formHeader").innerHTML = `<i class="bi bi-wallet text-danger me-2"></i>Log Expense`;
            document.getElementById("submitBtn").innerHTML = `<i class="bi bi-check-lg me-1"></i> Save Expense`;
            document.getElementById("cancelBtn").classList.add("d-none");
        }

        function saveExpense() {
            let vehicle = document.getElementById("eVehicle").value;
            let date = document.getElementById("eDate").value;
            let category = document.getElementById("eCategory").value;
            let amount = document.getElementById("eAmount").value;
            let description = document.getElementById("eDesc").value;
            let editIndex = document.getElementById("expEditIndex").value;

            if (!vehicle || !date || !category || !amount) {
                alert("Please fill in all required fields.");
                return;
            }

            let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
            let payload = {
                vehicle: vehicle,
                date: date,
                category: category,
                amount: Number(amount),
                description: description
            };

            if (editIndex !== "" && editIndex !== null) {
                expenses[Number(editIndex)] = payload;
            } else {
                expenses.push(payload);
            }

            localStorage.setItem("expenses", JSON.stringify(expenses));
            resetForm();
            loadExpenseTable();
        }

        function deleteExpense(index) {
            if (confirm("Are you sure you want to delete this expense entry?")) {
                let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
                if (expenses[index] !== undefined) {
                    expenses.splice(index, 1);
                    localStorage.setItem("expenses", JSON.stringify(expenses));
                    
                    let currentEditingIndex = document.getElementById("expEditIndex").value;
                    if (currentEditingIndex !== "" && Number(currentEditingIndex) === index) {
                        resetForm();
                    }
                    loadExpenseTable();
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            populateVehicles();
            document.getElementById("eDate").value = new Date().toISOString().split('T')[0];
            loadExpenseTable();
        });
    </script>
</body>
</html>
